# MLOps Lab 3 - GitHub Actions + Azure Machine Learning.
# Starter workflow: in the lab you add the "Run Azure Machine Learning training job" step
# (and later the pull_request trigger). A finished version is in mlops/solutions/.
name: Manually trigger an Azure Machine Learning job

on:
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repo
      uses: actions/checkout@v4
    - name: Install az ml extension
      run: az extension add -n ml -y
    - name: Azure login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
